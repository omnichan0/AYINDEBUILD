version: '3.8'\n\nservices:\n  web:\n    build: ../web\n    ports:\n      - \"3000:3000\"\n    environment:\n      - NODE_ENV=production\n      - SESSION_SECRET=ayindebuild-secret\n      - OLLAMA_HOST=http://ollama:11434\n    depends_on:\n      - ollama\n    volumes:\n      - /tmp/ayindebuild:/tmp/ayindebuild\n    networks:\n      - ayindebuild\n\n  ollama:\n    image: ollama/ollama:latest\n    ports:\n      - \"11434:11434\"\n    volumes:\n      - ollama-data:/root/.ollama\n    networks:\n      - ayindebuild\n    command: serve\n\nvolumes:\n  ollama-data:\n\nnetworks:\n  ayindebuild:\n    driver: bridge\n